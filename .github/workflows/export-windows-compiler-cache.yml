name: Export GitHub Windows compiler cache

# Uploads a GitHub-side Windows ccache (saved by benchmark_buildWindows.yml) as
# an artifact, so the private copy can import it: a 2 vCPU GitHub runner can't
# finish a cold Windows build inside the 6-hour job limit to prime its own.
on:
  workflow_dispatch:
    inputs:
      cache_key:
        description: Exact FCB-Windows-github-... cache key to export
        type: string
        required: true

permissions:
  contents: read

jobs:
  export:
    runs-on: windows-2022
    steps:
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:/FC/cache/
          key: ${{ inputs.cache_key }}
          fail-on-cache-miss: true
      - name: Pack compiler cache
        run: tar -czf compiler-cache.tar.gz -C C:/FC cache
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: github-windows-compiler-cache
          path: compiler-cache.tar.gz
          retention-days: 7
          compression-level: 0
